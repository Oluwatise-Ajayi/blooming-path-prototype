<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomingPath - Workforce Readiness Prototype</title>
  
  <!-- Tailwind CSS with Forms & Container Queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-container": "#6e2c00",
            "surface": "#faf8ff",
            "voice-recording": "#ef4444",
            "on-primary-fixed": "#00164e",
            "secondary-fixed": "#6ffbbe",
            "background": "#faf8ff",
            "error": "#ba1a1a",
            "on-tertiary-fixed-variant": "#773205",
            "surface-bright": "#faf8ff",
            "inverse-surface": "#2f3036",
            "on-secondary-fixed": "#002113",
            "secondary-fixed-dim": "#4edea3",
            "surface-variant": "#e3e1e9",
            "inverse-primary": "#b6c4ff",
            "primary": "#00236f",
            "on-surface": "#1a1b21",
            "error-container": "#ffdad6",
            "on-tertiary": "#ffffff",
            "on-tertiary-fixed": "#341100",
            "voice-processing": "#3b82f6",
            "primary-container": "#1e3a8a",
            "outline": "#757682",
            "on-error": "#ffffff",
            "on-primary": "#ffffff",
            "on-primary-container": "#90a8ff",
            "on-surface-variant": "#444651",
            "surface-container-highest": "#e3e1e9",
            "on-tertiary-container": "#f39461",
            "secondary-container": "#6cf8bb",
            "on-background": "#1a1b21",
            "tertiary": "#4b1c00",
            "surface-container-low": "#f4f3fa",
            "voice-glow": "rgba(30, 58, 138, 0.15)",
            "secondary": "#006c49",
            "surface-tint": "#4059aa",
            "inverse-on-surface": "#f1f0f7",
            "on-primary-fixed-variant": "#264191",
            "on-secondary": "#ffffff",
            "surface-container-high": "#e9e7ef",
            "tertiary-fixed-dim": "#ffb691",
            "tertiary-fixed": "#ffdbcb",
            "primary-fixed-dim": "#b6c4ff",
            "onboarding-bg": "#f8f9ff",
            "surface-container-lowest": "#ffffff",
            "outline-variant": "#c5c5d3",
            "primary-fixed": "#dce1ff",
            "voice-success": "#10b981",
            "on-secondary-fixed-variant": "#005236",
            "surface-dim": "#dad9e1",
            "on-secondary-container": "#00714d",
            "surface-container": "#eeedf4",
            "on-error-container": "#93000a"
          },
          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "mobile-gutter": "16px",
            "mobile-margin": "24px",
            "stack-sm": "8px",
            "voice-indicator-size": "80px",
            "stack-md": "16px",
            "stack-lg": "32px"
          },
          "fontFamily": {
            "onboarding-body": ["Inter", "sans-serif"],
            "voice-label": ["Inter", "sans-serif"],
            "body-md": ["Inter", "sans-serif"],
            "onboarding-title": ["Inter", "sans-serif"],
            "label-sm": ["Inter", "sans-serif"],
            "headline-lg-mobile": ["Inter", "sans-serif"],
            "sans": ["Inter", "sans-serif"]
          },
          "fontSize": {
            "onboarding-body": ["17px", { "lineHeight": "26px", "fontWeight": "400" }],
            "voice-label": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }],
            "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
            "onboarding-title": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
            "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "600" }],
            "headline-lg-mobile": ["24px", { "lineHeight": "32px", "fontWeight": "600" }]
          },
          "boxShadow": {
            "btn-shadow": "0px 8px 20px rgba(30, 58, 138, 0.2)",
            "voice-btn": "0px 8px 20px rgba(30, 58, 138, 0.2)",
            "ambient": "0px 8px 20px rgba(30, 58, 138, 0.2)"
          },
          "animation": {
            "pulse-glow": "pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite",
            "spin-slow": "spin 3s linear infinite"
          },
          "keyframes": {
            pulseGlow: {
              "0%, 100%": { opacity: "1", transform: "scale(1)", boxShadow: "0 0 0 0 rgba(239, 68, 68, 0.4)" },
              "50%": { opacity: ".8", transform: "scale(1.05)", boxShadow: "0 0 0 15px rgba(239, 68, 68, 0)" }
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-background min-h-screen font-sans antialiased selection:bg-secondary-container">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
