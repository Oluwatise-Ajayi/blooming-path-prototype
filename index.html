<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BloomingPath - Workforce Readiness Prototype</title>
  
  <!-- Tailwind CSS with Forms & Container Queries -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#00236f",
            "primary-container": "#1e3a8a",
            "on-primary": "#ffffff",
            "primary-fixed": "#dce1ff",
            "primary-fixed-dim": "#b6c4ff",
            "secondary": "#006c49",
            "secondary-container": "#6cf8bb",
            "secondary-fixed-dim": "#4edea3",
            "on-secondary-container": "#00714d",
            "on-secondary": "#ffffff",
            "tertiary": "#00312b",
            "tertiary-container": "#004941",
            "tertiary-fixed": "#62fae3",
            "on-tertiary-container": "#00c1ad",
            "background": "#f8f9ff",
            "on-background": "#0d1c2e",
            "surface": "#f8f9ff",
            "on-surface": "#0d1c2e",
            "surface-variant": "#d5e3fc",
            "on-surface-variant": "#444651",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#eff4ff",
            "surface-container": "#e6eeff",
            "surface-container-high": "#dce9ff",
            "surface-container-highest": "#d5e3fc",
            "outline": "#757682",
            "outline-variant": "#c5c5d3",
            "error": "#ba1a1a",
            "error-container": "#ffdad6"
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-background min-h-screen font-sans antialiased selection:bg-secondary-container">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
